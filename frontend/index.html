<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Sistema Cuentas por Cobrar</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2 class="logo">CxC System</h2>

        <ul>
          <li onclick="cargar('dashboard')">Dashboard</li>
          <li onclick="cargar('clientes')">Clientes</li>
          <li onclick="cargar('documentos')">Tipos de Documento</li>
          <li onclick="cargar('transacciones')">Transacciones</li>
          <li onclick="cargar('asientos')">Asientos Contables</li>
          <li onclick="cargar('consultas')">Consultas</li>
        </ul>
      </aside>

      <main class="main">
        <header class="header">
          <h1>Sistema de Cuentas por Cobrar</h1>
        </header>

        <section id="contenido" class="contenido">
          <div class="cards">
            <div class="dashboard-card">
              <h3>Clientes</h3>
              <p id="dash-clientes">0</p>
            </div>

            <div class="dashboard-card">
              <h3>Transacciones</h3>
              <p id="dash-transacciones">0</p>
            </div>

            <div class="dashboard-card">
              <h3>Balance</h3>
              <p id="dash-balance">$0</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
    <script src="clientes.js"></script>
    <script src="transacciones.js"></script>
  </body>
</html>
